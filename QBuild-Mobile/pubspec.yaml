name: qbuild_mobile
description: QBuild Mobile App for Construction Inspection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.3
  
  # Navigation
  go_router: ^13.0.0
  
  # UI Components
  material_design_icons_flutter: ^7.0.7296
  
  # Utilities
  logger: ^2.3.0
  intl: ^0.19.0
  #image_picker
  image_picker: ^1.0.0
  # JSON & Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/qbuild.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/qbuild.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
